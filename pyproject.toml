[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deerflow-extension-agent-hints"
version = "0.2.0"
description = "Agent Hint protocol v1.0 sender for DeerFlow: X-Agent-Hint on main-line model requests plus pause/resume/stop/compact manage requests."
readme = "README.md"
license = "MulanPSL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "evan7ang" }]
keywords = ["deer-flow", "langchain", "langgraph", "middleware", "agents", "llm", "serving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "deerflow-extension-api>=0.2.13,<0.3",
  "langchain>=1.3,<2",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "langchain-openai>=1.2,<2", "langchain-anthropic>=1.4,<2"]

[project.entry-points."deerflow.extensions"]
agent-hints = "deerflow_agent_hints:install"

[project.urls]
Repository = "https://github.com/evan7ang/deer-flow-agent-hints"

[tool.hatch.build.targets.wheel]
packages = ["src/deerflow_agent_hints"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "e2e", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
